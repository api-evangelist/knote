name: Knote
description: 'Knote is a small New York-based startup backed by 500 Global, surfaced through the
  500 Global portfolio and added to the API Evangelist network as an enrichment lead. Third-party
  company databases describe it inconsistently: Tracxn profiles Knote as a knowledge-management
  platform that raised roughly $150K from 500 Global, while Dealroom describes it as an AI-powered
  email summarization and management tool. No first-party description could be confirmed. As of the
  2026-07-19 enrichment pass the knote.com web property is offline — the domain resolves (Cloudflare
  nameservers, an EC2 A record, live Google Workspace MX and an SPF record including Mailgun and
  Mailchimp) but refuses connections on both port 80 and port 443, so no homepage, developer portal,
  documentation, API reference, or machine-readable specification could be retrieved. No corporate
  GitHub organization, package-registry client library, or public API surface was found; the
  GitHub repositories named "Knote" are unrelated third-party note-taking and Kubernetes-course
  projects. This profile therefore carries only what could be independently verified: the funding
  and identity facts above plus a live DNS/TLS domain-security probe. It should be treated as a
  dormant or defunct lead and re-checked if the domain returns to service.'
